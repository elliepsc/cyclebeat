# CycleBeat API contract — written BY HAND, BEFORE the backend (crit. 5, V3 §6).
#
# This file is the contract, not a by-product. FastAPI does NOT generate it: CI compares the
# schema FastAPI produces against this file and fails on any divergence
# (tests/test_api_contract.py). If the two disagree, this file is right and the code is wrong.
#
# Shapes come from appendix E.3 verbatim. Two deliberate, documented departures, each marked
# at its site below:
#   1. `Segment.coaching` is nullable. E.3 declares it, but it is generated by the LLM in
#      phase 6; contracting it now as nullable means phase 6 fills it without a breaking
#      change, and the phase-5 frontend can already code against the field.
#   2. `Segment.role` is additive. E.3 predates ADR-007, which gave every segment a narrative
#      role the planner already computes and the timeline UI needs. Additive to a response,
#      so not a breaking change.
#
# The 3 copilot/LLM endpoints of §6 (`/v1/copilot/ask`, `/v1/copilot/runs/{id}`,
# `/v1/ops/llm-costs`) are deliberately ABSENT: they need `fct_llm_calls`, `fct_agent_runs`
# and the agent itself, all phase-6 deliverables. Contracting an endpoint that answers
# nothing would make "no divergence" false in CI. They are added in phase 6.

openapi: 3.1.0

info:
  title: CycleBeat API
  version: "1.0.0"
  description: |
    BPM-driven indoor-cycling session planner.

    A session is built by a **deterministic** engine: the planner places tracks by their E.2
    zone and the ADR-007 construction rules, and the evaluator judges the result. No LLM is
    involved in any decision — in phase 6 it will only phrase what the engine already decided.

    Zones are fixed by appendix E.2 on `bpm_effective`:
    Z1 &lt; 100, Z2 100-115, Z3 116-130, Z4 131-145, Z5 &gt; 145.

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: health
    description: Liveness probe.
  - name: sessions
    description: Generate, replay and rate sessions.
  - name: quality
    description: BPM resolution coverage and data quality, from the dbt marts.

paths:
  # Unversioned on purpose: it is a probe, not a business route, and docker-compose plus the
  # Dockerfile HEALTHCHECK already target `/health`.
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/sessions/generate:
    post:
      tags: [sessions]
      summary: Build a session from a track source
      description: |
        Resolves the source into a catalogue, runs the deterministic planner, evaluates the
        result and persists it.

        Returns **422** when no valid session can be built from the catalogue — a playlist with
        no track slow enough to cool down on, for example. That is a refusal, not a failure:
        the engine will not return a session that skips its cooldown. The structured reasons
        are in `detail`.
      operationId: generateSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSessionRequest"
      responses:
        "200":
          description: The generated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPlan"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/sessions:
    get:
      tags: [sessions]
      summary: List past sessions, newest first
      operationId: listSessions
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of session summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        # The server really does answer 422 here — `?limit=9999` breaches the bound above.
        # Undeclared, the generated client would have no typed branch for a failure it will
        # actually see.
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/sessions/{session_id}:
    get:
      tags: [sessions]
      summary: Replay one session
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The stored session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sessions/{session_id}/feedback:
    post:
      tags: [sessions]
      summary: Rate a session
      operationId: submitFeedback
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/quality/coverage:
    get:
      tags: [quality]
      summary: BPM resolution coverage per source
      description: Rows of `mart_bpm_coverage` — one per BPM source (E.3).
      operationId: getQualityCoverage
      responses:
        "200":
          description: One record per resolution source.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageRow"

  /v1/quality/summary:
    get:
      tags: [quality]
      summary: Catalogue-wide data quality
      description: |
        A single aggregate record, as E.3 specifies. `mart_data_quality` itself has one row per
        `confidence_method`; that breakdown is returned inside `by_method`, so this endpoint and
        `/v1/quality/coverage` do not duplicate each other.
      operationId: getQualitySummary
      responses:
        "200":
          description: One aggregate record over the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualitySummary"

components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: No such resource (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is well-formed but cannot be satisfied (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    # RFC 7807. E.3 fixes the four members; `reasons` is additive and carries the planner's
    # machine-readable refusal codes (e.g. `no_cooldown_candidate`) so a client can react to
    # WHY a session was impossible instead of parsing prose.
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reasons:
          type: array
          items: { type: string }

    Level:
      type: string
      enum: [beginner, intermediate, advanced]
    Goal:
      type: string
      enum: [endurance, intervals, recovery]
    Zone:
      type: string
      enum: [Z1, Z2, Z3, Z4, Z5]
    Verdict:
      type: string
      enum: [safe, review]
    SegmentRole:
      type: string
      enum: [warmup, recovery, endurance, cardio, intensity, sprint, cooldown]

    TrackSource:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [deezer_url, csv, demo]
        value:
          type: string
          description: |
            Playlist URL, CSV path, or `""` for `demo` (which reads the committed catalogue).
            `deezer_url` needs live network and is refused with 422 under `DEMO_MODE` (E.8).

    GenerateSessionRequest:
      type: object
      required: [source, level, goal, duration_min]
      properties:
        source: { $ref: "#/components/schemas/TrackSource" }
        level: { $ref: "#/components/schemas/Level" }
        goal: { $ref: "#/components/schemas/Goal" }
        duration_min:
          type: integer
          minimum: 20
          maximum: 120

    Track:
      type: object
      required: [track_id, title, artist, duration_s]
      properties:
        track_id: { type: string }
        title: { type: string }
        artist: { type: string }
        duration_s: { type: number }
        bpm_effective:
          type: [number, "null"]
          description: Normalized per E.2. Never null inside a segment.
        zone:
          oneOf:
            - $ref: "#/components/schemas/Zone"
            - type: "null"
        confidence:
          type: [number, "null"]
          description: E.2 — 0.9 cross-validated, 0.6 single source, 0.3 under review.
        preview_url:
          type: [string, "null"]

    # Phase 6 populates this. Nullable until then — see the header note.
    Coaching:
      type: object
      required: [instruction, transition_cue, kb_refs]
      properties:
        instruction: { type: string }
        transition_cue: { type: string }
        kb_refs:
          type: array
          items: { type: string }

    Segment:
      type: object
      required: [order, track, zone, role, duration_s]
      properties:
        order: { type: integer }
        track: { $ref: "#/components/schemas/Track" }
        zone: { $ref: "#/components/schemas/Zone" }
        role:
          allOf:
            - $ref: "#/components/schemas/SegmentRole"
          description: Additive to E.3 — see ADR-007 and the header note.
        duration_s:
          type: number
          description: The FULL track duration (ADR-007 decision 3).
        coaching:
          oneOf:
            - $ref: "#/components/schemas/Coaching"
            - type: "null"

    ExcludedTrack:
      type: object
      required: [track_id, reason]
      properties:
        track_id: { type: string }
        reason:
          type: string
          description: |
            Stable code, not prose: `no_bpm`, `duplicate_track_id`, `invalid_duration`,
            `not_needed`, or `goal_<goal>_zone`.

    SessionPlan:
      type: object
      required:
        [session_id, level, goal, duration_min, verdict, segments, duration_gap_s, warnings, created_at]
      properties:
        session_id: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        goal: { $ref: "#/components/schemas/Goal" }
        duration_min: { type: integer }
        verdict: { $ref: "#/components/schemas/Verdict" }
        segments:
          type: array
          items: { $ref: "#/components/schemas/Segment" }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/ExcludedTrack" }
        duration_gap_s:
          type: number
          description: Signed. Positive means the session overruns the target.
        warnings:
          type: array
          items: { type: string }
        created_at:
          type: string
          format: date-time

    SessionSummary:
      type: object
      required:
        [session_id, level, goal, duration_min, verdict, n_segments, duration_gap_s, created_at]
      properties:
        session_id: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        goal: { $ref: "#/components/schemas/Goal" }
        duration_min: { type: integer }
        verdict: { $ref: "#/components/schemas/Verdict" }
        n_segments: { type: integer }
        duration_gap_s: { type: number }
        created_at: { type: string, format: date-time }

    SessionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    FeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: string
          enum: [up, down]
        note:
          type: [string, "null"]
          maxLength: 1000

    Feedback:
      type: object
      required: [session_id, rating, created_at]
      properties:
        session_id: { type: string }
        rating:
          type: string
          enum: [up, down]
        note:
          type: [string, "null"]
        created_at: { type: string, format: date-time }

    CoverageRow:
      type: object
      required: [source, n_tracks, pct_of_catalogue, n_usable]
      properties:
        source:
          type: string
          description: E.2 enum — `deezer`, `librosa`, `getsongbpm` or `manual`.
        n_tracks:
          type: integer
          description: Tracks this source gave an opinion on.
        pct_of_catalogue:
          type: number
          minimum: 0
          maximum: 100
          description: >
            A PERCENTAGE, 0-100 — not a 0-1 ratio. Computed as n_usable over the WHOLE
            catalogue, not over n_tracks, so the figures are comparable between sources.
            Stated here because the frontend reads this file and nothing else.
        n_usable:
          type: integer
          description: Of those, how many carried a usable BPM after E.2 normalization.

    QualitySummary:
      type: object
      required:
        [n_tracks, n_with_bpm, pct_with_bpm, n_flagged_review, pct_flagged_review, by_method]
      properties:
        n_tracks: { type: integer }
        n_with_bpm:
          type: integer
          description: Planner-eligible tracks — E.2 excludes the rest.
        pct_with_bpm:
          type: number
          minimum: 0
          maximum: 100
          description: "A percentage, 0-100 — not a 0-1 ratio."
        n_flagged_review: { type: integer }
        pct_flagged_review:
          type: number
          minimum: 0
          maximum: 100
          description: "A percentage, 0-100 — not a 0-1 ratio."
        avg_confidence:
          type: [number, "null"]
        by_method:
          type: object
          description: Track count per `confidence_method` — the mart's own grain.
          additionalProperties:
            type: integer
