[project]
name = "cyclebeat"
version = "0.1.0"
description = "CycleBeat — BPM-driven cycling session planner (data pipeline + API + coaching UI)"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Migrated 1:1 from requirements.txt (phase 0, runbook step 4), then reduced to
# what the purged repo actually imports (phase 0, runbook step 3).
# Constraint operators are preserved as-is; exact resolution lives in uv.lock.
dependencies = [
    # Core
    "python-dotenv==1.0.1",
    "requests>=2.32.0",
    # Ingestion
    "dlt[duckdb]==0.5.4",
    # dlt 0.5.4 imports `pkg_resources` at import time without declaring
    # setuptools. It used to arrive transitively via torch/sentence-transformers;
    # purging those broke `import dlt`, so it is now declared explicitly.
    # Dropped when dlt is upgraded in phase 2.
    "setuptools>=70,<81",
    # Warehouse — imported directly by db/runtime.py, so declared explicitly
    # instead of relying on the dlt[duckdb]/dbt-duckdb transitive pin.
    "duckdb==0.10.2",
    # API
    # Bumped from 0.111.0 in phase 2: Airflow 3 requires fastapi >= 0.115, and both have to
    # coexist in one environment because the same pytest run imports the DAGs and the API.
    # Range rather than a pin, so the Airflow resolution stays satisfiable.
    "fastapi>=0.115.0,<0.116",
    "uvicorn==0.30.1",
    "pydantic>=2.7,<3",
    # dbt
    "dbt-duckdb>=1.8.0",
    # Monitoring
    "prometheus-fastapi-instrumentator==6.1.0",
]

[project.optional-dependencies]
# librosa is the ADR-005 backbone, but only for LIVE resolution. It drags numba + scipy
# (~200 MB) and CI never runs it: `make ingest`, `make dbt`, the DAG tests and the whole
# pytest suite read the committed snapshot instead (E.8 "snapshot demo committé"). Keeping
# it optional is what stops that weight entering uv.lock's default resolution and the image.
#     uv sync --extra audio     # only when you actually want to analyse previews
audio = [
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "ruff>=0.6.0",
    "mypy>=1.11",
    # §11 names hypothesis as the property-based layer of the test strategy ("invariants
    # planner sur playlists générées"), so this is a normative requirement rather than a
    # preference. Test-only: nothing under cyclebeat/ or api/ imports it, and it stays out
    # of the runtime image.
    "hypothesis>=6.100,<7",
    # §11 and §15 both name schemathesis as the contract-test layer: it drives openapi.yaml
    # against the running app and finds contract/implementation divergence automatically.
    # Test-only, like hypothesis (which it is built on).
    "schemathesis>=3.25,<4",
    # Asserts openapi.yaml is a VALID OpenAPI 3.1 document, not merely valid YAML. Declared
    # rather than left to `importorskip`, because a test that skips itself when a dependency
    # is absent is a bypassed test (E.0.4), and this one guards the contract itself.
    "openapi-spec-validator>=0.7,<0.8",
    # Airflow 3 is needed to IMPORT the DAGs, which is what the three E.5 tests do. It does
    # not run on Windows: `make test-unit` therefore requires WSL or Linux (README,
    # "Development environment"). The tests are not skipped there — the environment is the
    # requirement, per E.0.4's ban on bypassing a failing test.
    "apache-airflow>=3.0,<4",
]

[tool.uv]
# No installable package yet: the repo is still a set of top-level modules
# (api/, db/, ingest/, ...). A `cyclebeat/` package arrives with the V3 rewrite.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "dbt/logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The repo is still a set of top-level modules (api/, db/, ingest/), not an
# installed package, so the project root has to be importable from the tests.
pythonpath = ["."]

[tool.mypy]
# E.6 requires strict mypy on `cyclebeat/` and `api/`. `cyclebeat/` does not
# exist yet, and today's `api/main.py` is v1 code rewritten contract-first in
# phases 4-5 — so `make typecheck` is red on purpose and is not gating yet.
python_version = "3.11"
files = ["api"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Third-party packages without bundled type stubs.
module = ["dlt.*"]
ignore_missing_imports = true
