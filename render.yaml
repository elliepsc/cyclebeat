###############################################################################
# CycleBeat — Render.com deployment config
#
# Phase 0 purge (ADR-001): the Spotify/Qdrant env vars and the UI service are
# gone — those bricks no longer exist in the repo. What remains is the API
# service. The full deployment pipeline (auto-deploy on green main, React
# front) is phase 9; this file is kept coherent, not finished.
#
# Deploy:
#   1. Connect this repo to Render (New → Blueprint)
#   2. Render builds and deploys the API service
###############################################################################

services:

  # ── REST API ───────────────────────────────────────────────────────────────
  - type: web
    name: cyclebeat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: RUNTIME_DB_PATH
        value: /app/data/cyclebeat_runtime.duckdb
    # No startCommand: the demo warehouse is baked into the image at build time (ADR-003),
    # so the Dockerfile CMD (uvicorn) starts straight away. The CMD binds to Render's $PORT.
