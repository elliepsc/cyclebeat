name: CI

# lint + typecheck + unit tests + evals + contract + dbt build, the frontend job, and the
# deploy job (main only, after every test job is green). Integration tests are phase 8.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Re-run the deployment of main without a new commit (e.g. after a failed deploy job).
  # The `deploy` job below still only runs on refs/heads/main.
  workflow_dispatch:

permissions:
  contents: read

# Zero cost (E.8): a new push cancels the superseded run instead of paying for it -- except on
# main, where cancelling could cut a run that is waiting for Render to finish a deploy. There
# the next run queues behind it (GitHub keeps only the newest queued run per group).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNTIME_DB_PATH: ${{ github.workspace }}/data/cyclebeat_runtime.duckdb

    # A real Postgres for the repository tests (ADR-009). Same image as docker-compose.yml.
    # It is reached through TEST_DATABASE_URL, never DATABASE_URL: the test suite strips the
    # latter, which is the production variable.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyclebeat
          POSTGRES_PASSWORD: cyclebeat
          POSTGRES_DB: cyclebeat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclebeat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv provisions the Python 3.11 toolchain itself (.python-version) and
      # installs strictly what uv.lock pins — a drifted lock fails here.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      # Strict mypy on `api/`. Gating from phase 4 on: it was red only because of the v1
      # `api/main.py`, which the contract-first rewrite deleted. If this goes red again, v1
      # code has crept back.
      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      # The Postgres path of the transactional store against a real server. `test-unit` already
      # collects these tests but skips them (no TEST_DATABASE_URL there). Here the variable is
      # set, so they run; an unreachable server errors in the fixture rather than skipping.
      - name: Repository tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql://cyclebeat:cyclebeat@localhost:5432/cyclebeat
        run: uv run pytest tests/unit/test_api_repositories.py -rs

      # The phase-3 exit criterion (§15) and condition 2 of §2.5: the mutation
      # check green IN CI, not merely on a developer's machine. Kept a separate
      # step from `test-unit` because §11 keeps the suites physically apart, and
      # because a red step named "eval" says which criterion broke. The phase-6
      # coach/copilot evals join this same target.
      - name: Evals (adversarial + mutation check)
        run: make eval

      # dbt reads the runtime DuckDB, so the demo knowledge base
      # (data/cycling_patterns.json, committed) is ingested first. No network,
      # no API quota consumed (E.8).
      - name: Ingest demo knowledge base
        run: make ingest

      - name: dbt build
        run: make dbt

      # The phase-4 exit criterion: "contrat validé en CI". Two checks in one file --
      # openapi.yaml vs the schema FastAPI generates (contract-first), and schemathesis
      # driving the contract against the real app. Runs AFTER dbt so the quality endpoints
      # answer against built marts rather than an empty warehouse.
      - name: Contract
        run: make contract

  # Frontend (phase 5). Its own job: the Python job above is untouched, and the two run in
  # parallel. Node is pinned by frontend/.nvmrc.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Locked install: fails when package.json and package-lock.json disagree.
      - name: Install dependencies
        run: npm ci

      # The client is generated from openapi.yaml and committed. Regenerate it and fail when
      # the committed file differs from what the contract produces.
      - name: Generated client matches the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Tests
        run: npm test

      # Type-checks (tsc strict) then bundles.
      - name: Build
        run: npm run build

  # Deployment (ci/deploy-job). Render deploys nothing by itself (autoDeployTrigger: off in
  # render.yaml): this job triggers the two deploy hooks for the commit that just passed,
  # waits until Render reports each deploy live on that commit, then smoke-tests production.
  # Push and manual runs only, and only on main: never a pull request, never another branch.
  deploy:
    needs: [build, frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets and variables live in the GitHub environment `production` (limited to main).
    environment: production
    # Two deploys never overlap, and a queued one is never cancelled mid-flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # 20 min waiting for the slower deploy + 5 min of smoke test, with margin.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # tools/deploy.py uses the standard library only: no dependency to install. It reads
      # GITHUB_SHA (set by the runner: the commit being deployed). The secrets and variables
      # are passed to this step alone, and the script never prints a URL or a key.
      - name: Deploy to Render and smoke-test
        run: python -m tools.deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
