# The full system, in one command and with no `.env` to fill in:
#
#     docker compose up --build
#
# starts three services, each with a healthcheck: `postgres` (transactional store), `api`
# (FastAPI, serving the demo warehouse baked into its image) and `web` (the React app, built
# against the compose API). Open http://localhost:4173.
#
# Every value below is a LOCAL default, not a secret: the Postgres password only opens a
# container with no published port, and production uses none of it (E.0.5).
#
# Host ports keep each service's conventional default (8000 API, 4173 web, 8080 Airflow,
# 9090 Prometheus, 3000 Grafana). They are only interpolated, never hard-coded, so a port
# already taken by another local stack can be stepped past without editing this file:
#
#     make compose-up            # picks the first free port from each default
#     CYCLEBEAT_API_PORT=9000 docker compose up --build   # or pin one by hand
#
# The web bundle has the API URL baked in at build time (VITE_API_URL), so after changing
# CYCLEBEAT_API_PORT or CYCLEBEAT_WEB_PORT, rebuild (`--build`): the URL and the CORS origin
# both follow the same variables, but only a rebuild puts the new URL into the bundle.
#
# Opt-in profiles, never started by a plain `up`:
#   pipeline    ingest + dbt (one-shot) and Airflow -- they WRITE the host's data/ and lake/
#   monitoring  Prometheus + Grafana
#
# Container-side ports never move, so `api:8000` in monitoring/prometheus.yml and the
# Grafana datasource pointing at `prometheus:9090` are unaffected by any of this. No service
# has a fixed `container_name`: a second project (`docker compose -p cyclebeat-it`, used by
# `make test-integration`) must be able to run beside the developer's own stack.
services:

  # ── Postgres: the TRANSACTIONAL store (ADR-009) ──────────────────
  # Sessions and feedback. DuckDB stays the analytical warehouse -- two stores, two roles.
  # Zero cost (E.8): a container locally.
  #
  # No host port published on purpose: only the API talks to it, and publishing 5432 would
  # collide with any Postgres the developer already runs. Reach it for debugging with
  # `docker compose exec postgres psql -U cyclebeat`.
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cyclebeat
      - POSTGRES_PASSWORD=cyclebeat
      - POSTGRES_DB=cyclebeat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP (-h 127.0.0.1), not the Unix socket: while the image runs its first-boot
      # init, a temporary server answers on the socket only, and a socket probe would report
      # healthy before the API can actually connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cyclebeat -d cyclebeat"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── FastAPI REST API ─────────────────────────────────────────────
  # Serves the demo warehouse built INTO the image (ADR-003). Nothing is mounted over
  # /app/data: a bind mount there would hide that database and read the host's instead.
  api:
    build: .
    ports:
      - "${CYCLEBEAT_API_PORT:-8000}:8000"
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
      # Set => Postgres. Unset => the SQLite fallback, which is what a bare clone gets.
      # The password here is a LOCAL dev credential for a container with no published port;
      # the production DSN never appears in this file (E.0.5).
      - DATABASE_URL=postgresql://cyclebeat:cyclebeat@postgres:5432/cyclebeat
      # The browser origins of the `web` service below. Both spellings of the local host,
      # because the browser treats http://localhost and http://127.0.0.1 as two origins.
      - CORS_ALLOW_ORIGINS=http://localhost:${CYCLEBEAT_WEB_PORT:-4173},http://127.0.0.1:${CYCLEBEAT_WEB_PORT:-4173}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── React frontend (static, served by nginx) ─────────────────────
  # Calls the API cross-origin, exactly like the Render deployment: the API URL is baked
  # into the bundle at build time and the API's CORS list names this origin.
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${CYCLEBEAT_API_PORT:-8000}
    ports:
      - "${CYCLEBEAT_WEB_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost: busybox wget may resolve localhost to ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Ingestion (one-shot, profile `pipeline`) ─────────────────────
  # Writes the HOST's data/ (bind mount). The compose API does not read it: it serves the
  # warehouse baked into its image.
  ingest:
    build: .
    profiles: ["pipeline"]
    command: python -m ingest.ingest_pipeline
    # This one-shot container never runs uvicorn, so the image HEALTHCHECK could only ever
    # report sick. `depends_on` here keys off service_completed_successfully (the exit code),
    # not health, so nothing depends on this probe.
    healthcheck:
      disable: true
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
    volumes:
      - ./data:/app/data
    restart: "no"

  # ── dbt transforms (one-shot, profile `pipeline`, runs after ingestion) ──
  dbt:
    build: .
    profiles: ["pipeline"]
    command: >
      bash -c "dbt run --project-dir dbt --profiles-dir dbt &&
               dbt test --project-dir dbt --profiles-dir dbt"
    # Same inherited-probe problem as `ingest`: no uvicorn here.
    healthcheck:
      disable: true
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: "no"

  # ── Airflow 3, LocalExecutor (E.5) ───────────────────────────────
  # Profile `pipeline`: not started by a plain `docker compose up`, so the API stack stays
  # light. Bring the orchestrator up with:
  #     docker compose --profile pipeline up
  # then open http://localhost:8080 (admin/admin) to check the 3 DAGs.
  #
  # DEMO by default (E.8): CYCLEBEAT_DEMO=1 makes dag_ingest read the committed snapshot,
  # so the DAGs run green with no credentials, no network and no API quota.
  airflow:
    build:
      context: .
      args:
        # apache-airflow is in the dev group; the default --no-dev would not install it,
        # which is why the first run of this service said `airflow: command not found`.
        UV_SYNC_ARGS: ""
    profiles: ["pipeline"]
    ports:
      - "${CYCLEBEAT_AIRFLOW_PORT:-8080}:8080"
    environment:
      - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW_HOME=/app/data/airflow
      # DEMO ONLY: skips the login screen so the "3 DAGs green in the UI" check is one
      # click. Never set this on anything reachable from a network (phase 9 deploys the
      # API, not Airflow).
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=true
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
      - CYCLEBEAT_DEMO=1
      - PYTHONPATH=/app
      # Airflow 3.0.6 + PyJWT >= 2.10: with no issuer configured, the internal JWT
      # generator builds `iss: []` (an empty list, because its `[] -> None` converter
      # only exists on the token *validator*), and PyJWT rejects it with
      # `TypeError: Issuer (iss) must be a string.` -> every UI/API request 500s.
      # Setting any string here makes the generator return that string instead.
      - AIRFLOW__API_AUTH__JWT_ISSUER=cyclebeat
    volumes:
      - ./data:/app/data
      - ./dags:/app/dags
      - ./lake:/app/lake
    # Exec-form list, not a YAML folded scalar. `>` re-indents continuation lines into
    # separate shell lines, which is what split the previous command into `--firstname:
    # command not found` and a syntax error on `||`.
    #
    # `airflow standalone` migrates the DB, provisions the admin user and runs
    # api-server + scheduler + triggerer. Airflow 3 has NO `airflow users` command —
    # user management moved to the auth manager — so the old invocation was invalid
    # independently of the YAML.
    # Do NOT add AIRFLOW__API__BASE_URL to "match" a shifted host port.
    # The task SDK derives [core] execution_api_server_url from that base URL, and inside
    # the container nothing listens on that host port -- the UI would look right and every run
    # would fail. The default (localhost:8080) is the container-side truth; keep it.
    command: ["airflow", "standalone"]
    # The image is built for the API, so its Dockerfile HEALTHCHECK curls :8000/health.
    # This service runs Airflow, not uvicorn, so that probe can only ever fail and the
    # container would sit at `Up (unhealthy)` forever.
    healthcheck:
      disable: true

  # ── Prometheus (profile `monitoring`) ────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: ["monitoring"]
    ports:
      - "${CYCLEBEAT_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  # ── Grafana (profile `monitoring`) ───────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["monitoring"]
    ports:
      - "${CYCLEBEAT_GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cyclebeat
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
