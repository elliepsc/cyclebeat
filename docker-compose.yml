services:

  # ── Ingestion (one-shot) ─────────────────────────────────────────
  ingest:
    build: .
    container_name: cyclebeat_ingest
    command: python -m ingest.ingest_pipeline
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
    volumes:
      - ./data:/app/data
    restart: "no"

  # ── dbt transforms (one-shot, runs after ingestion) ──────────────
  dbt:
    build: .
    container_name: cyclebeat_dbt
    command: >
      bash -c "dbt run --project-dir dbt --profiles-dir dbt &&
               dbt test --project-dir dbt --profiles-dir dbt"
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: "no"

  # ── FastAPI REST API ─────────────────────────────────────────────
  api:
    build: .
    container_name: cyclebeat_api
    ports:
      - "8000:8000"
    environment:
      - RUNTIME_DB_PATH=/app/data/cyclebeat_runtime.duckdb
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: cyclebeat_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  # ── Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: cyclebeat_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cyclebeat
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  grafana_data:
