version: 2

models:
  - name: stg_sessions
    description: >
      Cleaned sessions from the TRANSACTIONAL store, via the lake (ADR-009). Grain is
      `session_id` — the key E.3 routes on. Replaces the v1 shape (title, playlist_url,
      track_count), which nothing has written since the contract-first rewrite.
    columns:
      - name: session_id
        description: "Grain. Generated by the API, opaque hex."
        tests: [not_null, unique]

      - name: level
        tests:
          - not_null
          - accepted_values:
              values: ['beginner', 'intermediate', 'advanced']

      - name: goal
        description: "E.3's enum. `intervals`, not the v1 `hiit` (ADR-007)."
        tests:
          - not_null
          - accepted_values:
              values: ['endurance', 'intervals', 'recovery']

      - name: verdict
        description: "The evaluator's two-value verdict (E.3). A blocked session is a 422 and never persists."
        tests:
          - not_null
          - accepted_values:
              values: ['safe', 'review']

      - name: duration_s
        description: >
          What the session actually lasts: target plus the signed planner gap. NOT
          `duration_min * 60`, which is the request rather than the plan.
        tests: [not_null]

      - name: track_count
        description: "One segment is one track (ADR-007), so this is `n_segments`."
        tests: [not_null]

  - name: stg_feedback
    description: >
      Cleaned feedback carrying TWO rating scales side by side. `satisfaction` is E.3's
      up/down, written by the API; `effort` is the v1 Great/Okay/Hard. They are different
      axes and are never mapped onto each other — see the model header and ADR-009.
    columns:
      - name: session_id
        description: >
          The real key (ADR-008). NULL only on v1 rows, which predate it — hence no not_null.

      - name: session_title
        description: >
          Denormalized label. The API derives it as `session-<first 8 of the id>` so this
          chain keeps working; v1 rows carry whatever the user typed.

      - name: rating_scale
        description: "Which axis the row is on. `unknown` is the failure mode the singular test gates."
        tests:
          - not_null
          - accepted_values:
              values: ['satisfaction', 'effort', 'unknown']

      - name: rating
        description: >
          Normalized WITHIN its scale. The accepted values are the union of the two
          vocabularies; `dbt/tests/check_invalid_rating.sql` is what actually fails the build
          on an unrecognised one, so 'Unknown' is listed here as a documented domain value
          rather than as something this test should pass silently.
        tests:
          - not_null
          - accepted_values:
              values: ['up', 'down', 'Great', 'Okay', 'Hard', 'Unknown']

  - name: stg_patterns
    description: "40-pattern knowledge base with effort_bucket derived field."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: phase
        tests: [not_null]
      - name: effort_bucket
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high']
