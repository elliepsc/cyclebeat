version: 2

# Every mart states its grain in its description and has a test that guarantees it: `unique`
# on a single-column key, or a singular `check_*_grain` test on a composite one (GROUP BY
# compares NULLs as equal, which a concatenated `unique` key would not). KPI definitions,
# and the count-vs-NULL rule they follow, are in docs/metrics.md.

models:
  - name: dim_track
    description: >
      E.2 track dimension — one row per track with its resolved BPM, zone and confidence.
      Grain is track_id; a track re-ingested on a later `dt` refreshes rather than duplicates.
    columns:
      - name: track_id
        description: "Grain. Deezer id, or a `csv:` slug for a manual import."
        tests: [not_null, unique]

      - name: title
        description: "Track title as the source platform returned it, latest ingestion. Never NULL in raw (RawTrack)."

      - name: artist
        description: "Artist name as the source platform returned it, latest ingestion. Never NULL in raw (RawTrack)."

      - name: source_platform
        description: "Where the track's identity comes from: `deezer`, or `csv` for a manual import (ADR-010). Identity only, never a BPM source."

      - name: duration_s
        description: "Full track length in seconds, as the platform reports it. NULL when the platform gave none."

      - name: preview_url
        description: >
          URL of the 30 s preview librosa analysed. NULL when the ingested record carries none
          (the committed demo snapshot stores none). Never persisted as audio (ADR-010).

      - name: bpm_effective
        description: >
          Normalized BPM (E.2: halve above 180, double below 70), or NULL when no source had
          an opinion. ADR-006: when sources agree, this is librosa's value, not their mean.
          Range is asserted by `dbt/tests/check_bpm_effective_range.sql` — a singular test,
          matching the repo's existing convention, so no dbt package has to be installed.

      - name: zone
        description: >
          E.2 zones on bpm_effective after rounding to the nearest integer
          (`cyclebeat.e2.zone_for`): Z1 <100, Z2 100-115, Z3 116-130, Z4 131-145, Z5 >145.
          NULL exactly when bpm_effective is NULL.
        tests:
          - accepted_values:
              values: ['Z1', 'Z2', 'Z3', 'Z4', 'Z5']

      - name: confidence
        description: >
          0.9 cross_validated, 0.6 single_source or librosa_arbitrated, 0.3 review, NULL when
          no source had an opinion. E.2 fixes these four values, so the test asserts exactly
          them rather than a 0-1 range — a 0.75 would be inside the range and still be a
          contract violation. The pairing of each value with its method is asserted by
          `dbt/tests/check_confidence_matches_method.sql`.
        tests:
          - accepted_values:
              values: [0.9, 0.6, 0.3]
              quote: false

      - name: confidence_method
        description: >
          Which E.2 branch decided. `librosa_arbitrated` scores 0.6 like `single_source`
          (ADR-006) but stays a distinct method so the case remains auditable.
        tests:
          - not_null
          - accepted_values:
              values: ['cross_validated', 'single_source', 'librosa_arbitrated', 'review', 'unknown']

      - name: n_sources_agree
        description: >
          Number of sources whose normalized BPMs agree within ±3 BPM (`cyclebeat.e2.resolve`):
          2+ for cross_validated, 1 for single_source and librosa_arbitrated, 0 for review and
          unknown. Never NULL.
        tests: [not_null]

      - name: review
        description: "True only on the E.2 `review` branch (sources disagree by more than 3 BPM and librosa is absent)."

      - name: has_deezer_bpm
        description: "True when Deezer returned a positive `bpm` for this track (non-positive values mean 'no BPM' and are nulled in staging). Never NULL."

      - name: has_librosa_bpm
        description: "True when librosa returned a positive BPM on the preview. Never NULL."

      - name: has_manual_bpm
        description: "True when the CSV floor (manual import) carries a positive BPM for this track. Never NULL."

      - name: planner_eligible
        description: "False exactly when bpm_effective is NULL — E.2's 'excluded from the planner'."
        tests: [not_null]

      - name: ingested_dt
        description: "Lake partition date (`dt`, UTC day) of the latest ingestion of this track."

  - name: fct_session
    description: >
      The E.2 session fact, one row per `session_id`. Built from `stg_sessions`, which comes
      from the transactional store via the lake — the API writes no warehouse table
      (ADR-009 correcting ADR-008).
    columns:
      - name: session_id
        description: "Grain. Opaque hex id generated by the API."
        tests: [not_null, unique]

      - name: level
        description: "Rider level requested (E.3 enum: beginner | intermediate | advanced). Never NULL."

      - name: goal
        description: "Session goal requested (E.3 enum: endurance | intervals | recovery). Never NULL."

      - name: duration_min
        description: "Target duration requested, in minutes. Always > 0 (staging drops the rest)."

      - name: verdict
        description: "The evaluator's verdict. `review` means the session is usable but flagged; a blocked session is a 422 and never persists."
        tests:
          - not_null
          - accepted_values:
              values: ['safe', 'review']

      - name: n_segments
        description: "Number of segments the planner placed; one segment is one track (ADR-007)."

      - name: duration_gap_s
        description: "Seconds, signed: planned length minus target. Positive means the session overruns its target."
        tests: [not_null]

      - name: duration_s
        description: "Planned length in seconds: `duration_min * 60 + duration_gap_s`."

      - name: llm_cost_usd
        description: >
          Declared by E.2, NULL until phase 6 wires LiteLLM. Present now so the table matches
          the appendix shape rather than being altered later.

      - name: latency_ms
        description: "Declared by E.2, NULL until phase 6."

      - name: created_at
        description: "UTC timestamp at which the API persisted the session."

      - name: session_date
        description: "UTC calendar day of created_at."

  - name: mart_bpm_coverage
    description: >
      BPM resolution coverage per source. Grain is `source`. Backs `GET /v1/quality/coverage`
      (E.3) and sits on the copilot read allowlist (E.4). Counts each source's raw OPINION,
      read from stg_resolutions rather than dim_track, so a source that lost E.2 arbitration
      is still counted as having covered the track.
    columns:
      - name: source
        description: "Grain. The E.2 enum: deezer | librosa | getsongbpm | manual."
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['deezer', 'librosa', 'getsongbpm', 'manual']

      - name: n_tracks
        description: "Count of tracks this source gave an opinion on, usable or not (latest opinion per track and source)."
        tests: [not_null]

      - name: n_usable
        description: >
          Of those, how many carried a usable BPM. stg_resolutions has already nulled the
          non-positive values Deezer uses to mean "no BPM", so this counts real opinions.
          Bounded against n_tracks by `dbt/tests/check_bpm_coverage_bounds.sql`.
        tests: [not_null]

      - name: pct_of_catalogue
        description: >
          Percent, 1 decimal: `100 * n_usable / tracks in stg_tracks` — over the whole
          catalogue, not this source's rows. NULL when the catalogue is empty (division by
          zero guarded); resolutions without tracks would then still produce rows, and
          `not_null` would fail.
        tests: [not_null]

  - name: mart_data_quality
    description: >
      BPM coverage and confidence distribution. Grain is `confidence_method`, one row per E.2
      branch present in the catalogue (`unknown` for tracks no source resolved).
    columns:
      - name: confidence_method
        description: "Grain. The E.2 branch; a track with no verdict is counted as `unknown`."
        tests: [not_null, unique]
      - name: n_tracks
        description: "Count of catalogue tracks that landed in this branch."
        tests: [not_null]
      - name: pct_of_catalogue
        description: >
          Percent, 1 decimal: `100 * n_tracks / all catalogue tracks`. Asserted to sum to 100
          by `dbt/tests/check_data_quality_shares.sql`.
        tests: [not_null]
      - name: avg_confidence
        description: "Mean E.2 confidence of the branch, 3 decimals. NULL for `unknown`, whose tracks have no confidence."
      - name: n_with_bpm
        description: "Count of the branch's tracks with a non-NULL bpm_effective."
      - name: n_with_deezer_bpm
        description: "Count of the branch's tracks where Deezer returned a usable BPM."
      - name: n_with_librosa_bpm
        description: "Count of the branch's tracks where librosa returned a usable BPM."
      - name: n_flagged_review
        description: "Count of the branch's tracks flagged for human review (non-zero on the `review` branch only)."

  - name: mart_feedback_summary
    description: >
      Distribution of feedback ratings. Grain is `(rating_scale, rating)`: one row per rating
      value observed on each scale, guarded by `dbt/tests/check_feedback_summary_grain.sql`.
      The two scales (`satisfaction` up/down from the API, `effort` Great/Okay/Hard from v1)
      are never mixed (ADR-009). Each feedback is counted once: `stg_feedback` reads only the
      latest lake partition (#54).
    columns:
      - name: rating_scale
        description: "Which axis the ratings are on. `unknown` would mean an unrecognised rating, which `check_invalid_rating` fails."
        tests:
          - not_null
          - accepted_values:
              values: ['satisfaction', 'effort', 'unknown']
      - name: rating
        description: "The rating value, normalized within its scale."
        tests:
          - not_null
          - accepted_values:
              values: ['up', 'down', 'Great', 'Okay', 'Hard', 'Unknown']
      - name: count
        description: "Count of feedback rows with this rating on this scale. Never 0: a rating nobody gave has no row."
        tests: [not_null]
      - name: pct
        description: >
          Percent, 2 decimals: `100 * count / feedback rows on the same scale`. Shares sum to
          100 within a scale, never across scales. Never NULL (a row implies count > 0).
        tests: [not_null]

  - name: mart_pattern_coverage
    description: >
      How the pattern knowledge base covers effort and tempo. Grain is
      `(phase, effort_bucket, bpm_bucket, resistance_bucket, pattern_type)`: one row per
      combination present in `stg_patterns`, guarded by
      `dbt/tests/check_pattern_coverage_grain.sql`.
    columns:
      - name: phase
        description: "Session phase the patterns belong to (from the pattern file)."
        tests: [not_null]
      - name: effort_bucket
        description: "low | medium | high, derived in staging from the pattern's `effort` by an explicit mapping (#55); an unmapped or missing effort is `unknown`, which `check_invalid_pattern_buckets` fails."
        tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'unknown']
      - name: bpm_bucket
        description: "On bpm_mid (midpoint of the pattern's BPM window): slow < 100, moderate 100-130, fast over 130 to 155, very_fast over 155; a NULL bpm_mid is `unknown`, which `check_invalid_pattern_buckets` fails (#55)."
        tests:
          - not_null
          - accepted_values:
              values: ['slow', 'moderate', 'fast', 'very_fast', 'unknown']
      - name: resistance_bucket
        description: "On resistance (integer level, 1-10 in the current pattern file): light ≤ 3, moderate ≤ 6, hard ≤ 8, max above; a NULL resistance is `unknown`, which `check_invalid_pattern_buckets` fails (#55)."
        tests:
          - not_null
          - accepted_values:
              values: ['light', 'moderate', 'hard', 'max', 'unknown']
      - name: pattern_type
        description: "Pattern kind from the pattern file (`local` or `transition` today). Part of the grain; a NULL type would form its own group."
      - name: pattern_count
        description: "Count of patterns in the combination. Never 0: an absent combination has no row."
        tests: [not_null]
      - name: avg_bpm
        description: "Mean of the patterns' bpm_mid, in BPM, 1 decimal. NULL only if every pattern in the combination lacks a BPM window."
      - name: avg_resistance
        description: "Mean resistance level, 1 decimal. NULL only if every pattern in the combination lacks one."

  - name: mart_recent_activity
    description: >
      One row represents one feedback, as held by the latest lake extraction (one insert
      into the app-store `feedback` table; `stg_feedback` reads only the most recent `dt`
      partition), among the 20 most recent by `feedback_at`, with the context of the session
      it rates when it carries a `session_id` (a v1 row has none, #60). Key: (session_id,
      session_title, feedback_at), asserted by `dbt/tests/check_recent_activity_grain.sql`. Ties on `feedback_at` are broken by
      `session_id`, then `session_title`, so the 20 rows are deterministic; a table keeps
      no row order, so a reader sorts by `feedback_at` itself.
    columns:
      - name: feedback_at
        description: "When the feedback was stored (`created_at` of the app store), µs precision. Part of the key."
        tests:
          - not_null
      - name: feedback_date
        description: "UTC calendar day the feedback was submitted."
      - name: session_id
        description: "The rated session. NULL on v1 rows, which predate the key (ADR-008) and carry only session_title."
      - name: session_title
        description: "Display label: `session-<first 8 of the id>` for API rows, free text on v1 rows."
      - name: rating
        description: "The rating, normalized within its scale; read it with rating_scale."
        tests:
          - not_null
          - accepted_values:
              values: ['up', 'down', 'Great', 'Okay', 'Hard', 'Unknown']
      - name: rating_scale
        description: "`satisfaction` (API up/down) or `effort` (v1 Great/Okay/Hard). Carried so the two scales are never read as one."
        tests:
          - not_null
          - accepted_values:
              values: ['satisfaction', 'effort', 'unknown']
      - name: note
        description: "Free-text comment left with the rating. NULL when the user left none."
      - name: level
        description: "Rider level of the rated session. NULL when the feedback matches no session in stg_sessions."
      - name: goal
        description: "Goal of the rated session. NULL when the feedback matches no session."
      - name: duration_min
        description: "Target duration of the rated session, in minutes. NULL when the feedback matches no session."
      - name: track_count
        description: "Tracks in the rated session. NULL when the feedback matches no session."

  - name: mart_session_kpis
    description: >
      Global session KPIs. Grain: exactly one row, whatever the history holds — asserted by
      `dbt/tests/check_session_kpis_one_row.sql`. Counts are 0 on an empty history; means,
      extrema and dates are NULL there (docs/metrics.md). Both cases are unit-tested in
      `unit_tests.yml`, on an empty `int_session_summary` and on one with data.
    columns:
      - name: total_sessions
        description: "Count of persisted sessions. 0 on an empty history."
        tests: [not_null]
      - name: avg_duration_min
        description: "Mean target duration, in minutes, 1 decimal. NULL on an empty history."
      - name: total_tracks_used
        description: "Sum of track_count over all sessions — track slots, a track used twice counts twice. 0 on an empty history."
        tests: [not_null]
      - name: sessions_flagged_review
        description: "Count of sessions whose evaluator verdict is `review`. 0 on an empty history."
        tests: [not_null]
      - name: avg_abs_duration_gap_s
        description: "Mean of |duration_gap_s|, in seconds, 1 decimal: how far sessions land from their target, either way. NULL on an empty history."
      - name: last_session_at
        description: "UTC timestamp of the most recent session. NULL on an empty history."
      - name: avg_satisfaction_pct
        description: >
          Percent, 1 decimal: unweighted mean over sessions of each session's satisfaction_pct
          (share of `up` among its satisfaction ratings). Sessions without a satisfaction
          rating are skipped; NULL when no session has one.
