version: 2

# Unit tests run the model's SQL on fixed inputs (dbt >= 1.8). They prove a KPI's definition
# whatever the warehouse holds — the scratch and CI warehouses hold 0 sessions, where a data
# test on these marts passes without proving anything.

unit_tests:
  - name: session_kpis_empty_history
    description: >
      The docs/metrics.md rule on an empty history: counts are 0; means, extrema and dates
      are NULL. Failed on the `sum()` version of the mart (expected 0, got NULL).
    model: mart_session_kpis
    given:
      - input: ref('int_session_summary')
        rows: []
    expect:
      rows:
        - total_sessions: 0
          avg_duration_min: null
          total_tracks_used: 0
          sessions_flagged_review: 0
          avg_abs_duration_gap_s: null
          last_session_at: null
          avg_satisfaction_pct: null

  - name: session_kpis_with_history
    description: >
      Three sessions. The absolute gap is averaged in absolute value (|-10|, 20, 0 -> 10.0),
      and a session with no satisfaction rating is skipped by the satisfaction mean, not
      counted as 0 % ((100 + 50) / 2 -> 75.0).
    model: mart_session_kpis
    given:
      - input: ref('int_session_summary')
        rows:
          - {session_id: a, duration_min: 30, track_count: 8,  verdict: safe,   duration_gap_s: -10, created_at: "2026-10-01 08:00:00", satisfaction_pct: 100}
          - {session_id: b, duration_min: 45, track_count: 12, verdict: review, duration_gap_s: 20,  created_at: "2026-10-03 18:30:00", satisfaction_pct: null}
          - {session_id: c, duration_min: 60, track_count: 15, verdict: review, duration_gap_s: 0,   created_at: "2026-10-02 07:15:00", satisfaction_pct: 50}
    expect:
      rows:
        - total_sessions: 3
          avg_duration_min: 45.0
          total_tracks_used: 35
          sessions_flagged_review: 2
          avg_abs_duration_gap_s: 10.0
          last_session_at: "2026-10-03 18:30:00"
          avg_satisfaction_pct: 75.0
